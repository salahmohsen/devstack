# =============================================================================
# DevHub — infrastructure only (Dokploy compose "devhub-infra")
# =============================================================================
# App runtimes (web / server / agent) are separate Dokploy Applications.
# Keep network aliases hub-* so apps can resolve DB/Redis/MinIO on dokploy-network.
#
# Volumes (pg_data, redis_data, minio_data) keep the same names as the old
# full-stack compose so existing Dokploy project volumes are reused.
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-personal_hub}
    networks:
      default:
        aliases:
          - hub-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-personal_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000 --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      default:
        aliases:
          - hub-redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      default:
        aliases:
          - hub-minio

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        i=0
        until mc alias set local http://hub-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i + 1))
          if [ "$$i" -gt 30 ]; then
            echo "minio not ready after 60s" >&2
            exit 1
          fi
          sleep 2
        done
        bucket="$${S3_BUCKET:-personal-hub}"
        mc mb --ignore-existing "local/$$bucket"
        printf '%s\n' "{
          \"Version\": \"2012-10-17\",
          \"Statement\": [
            {
              \"Effect\": \"Allow\",
              \"Principal\": {\"AWS\": [\"*\"]},
              \"Action\": [\"s3:GetObject\"],
              \"Resource\": [\"arn:aws:s3:::$$bucket/*/avatars/*\"]
            }
          ]
        }" > /tmp/avatars-read.json
        mc anonymous set-json /tmp/avatars-read.json "local/$$bucket"
        echo "MinIO bucket ready: $$bucket (public GetObject for */avatars/*)"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-personal-hub}
    networks:
      - default

volumes:
  pg_data:
  redis_data:
  minio_data:
