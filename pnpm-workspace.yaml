packages:
  - apps/*
  - packages/*
  - tools/*

# pnpm v11: non-auth settings live here (not .npmrc). When a script runner's
# deps-status check wants to reinstall, skip the interactive "purge node_modules?"
# prompt so non-TTY pipelines (vp run, scripts/dev.sh pipes) don't abort with
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY.
# @see https://pnpm.io/settings — only auth/registry belong in .npmrc on v11+
confirmModulesPurge: false

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true

