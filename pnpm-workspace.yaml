  # assistant-ui doctor: one core/store. @assistant-ui/react@0.15.13 uses 0.3;
  # @assistant-ui/react-ai-sdk@1.3.40 (last AI SDK v6 pin) still declares 0.2.
  "@assistant-ui/core": 0.3.12
  "@assistant-ui/store": 0.3.8

# vite-plus-core is published under a different package name than "vite"; allow
# consumers that declare peer vite to resolve the aliased package.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # Oxlint/TanStack plugins still declare TS 5–6 peers; monorepo tsc is Go-native 7.
    # typescript-paths (via mastra) still needs the JS TS6 API — agent pins typescript@6.
    typescript: ">=5.4.0"
