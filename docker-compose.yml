# =============================================================================
# personal-hub — All-in-one Dokploy deployment
# =============================================================================
# Usage:
#   1. Set environment variables in Dokploy UI (see packages/env/.env.example)
#   2. Upload this repo to Dokploy
#   3. In Dokploy, use this as the Docker Compose file
#
# Required: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB (default personal_hub),
# REDIS_PASSWORD, MINIO_*, BETTER_AUTH_SECRET, VITE_SERVER_URL, VITE_WEB_URL,
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, FILES_API_SECRET
# =============================================================================

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Must be the database name (e.g. personal_hub), NOT the username.
      POSTGRES_DB: ${POSTGRES_DB:-personal_hub}
    healthcheck:
      # -d is required: without it pg_isready defaults DB name to the user
      # (e.g. personalhub), which does not exist when POSTGRES_DB differs.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-personal_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Host note: enable memory overcommit for safe BGSAVE under pressure:
    #   sysctl vm.overcommit_memory=1
    # (cannot set this sysctl from an unprivileged container)
    command: redis-server --appendonly yes --save 60 1000 --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  # ── Apps ────────────────────────────────────────────────────────────────────

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        VITE_SERVER_URL: ${VITE_SERVER_URL}
        VITE_WEB_URL: ${VITE_WEB_URL}
        # Dummy URL for build-time module load only — runtime uses encode-db-url.sh
        DATABASE_URL: postgresql://build:build@localhost:5432/build
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
        RESEND_API_KEY: ${RESEND_API_KEY}
        EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-personal_hub}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AGENT_WORKER_URL: ${AGENT_WORKER_URL:-http://agent:4111}
      VITE_SERVER_URL: ${VITE_SERVER_URL}
      VITE_WEB_URL: ${VITE_WEB_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ENABLE_OPEN_API_DOCS: ${ENABLE_OPEN_API_DOCS:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      PORT: "5100"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5100/server/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=PathPrefix(`/server`)"
      - "traefik.http.services.server.loadbalancer.server.port=5100"

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mastra_agent
      CREATE_DB: "true"
      # Mastra model strings like "deepseek/deepseek-v4-flash" read DEEPSEEK_API_KEY
      # (see apps/agent/src/mastra/model-config.ts). Must be listed here — Dokploy
      # project env alone does not inject into containers unless referenced.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Optional fallbacks if you switch models in model-config.ts:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4111/api/agents || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=PathPrefix(`/agent`)"
      - "traefik.http.services.agent.loadbalancer.server.port=4111"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        VITE_SERVER_URL: ${VITE_SERVER_URL}
        VITE_WEB_URL: ${VITE_WEB_URL}
        # Dummy URL for build-time only — prerender is disabled
        DATABASE_URL: postgresql://build:build@localhost:5432/build
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL}
      VITE_WEB_URL: ${VITE_WEB_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # SSR loads Better Auth (server env) even for public routes / health —
      # OAuth client credentials must be present or module init throws.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # Internal Docker-network URL of the Hono server, used by the web
      # app's SSR-time oRPC client to call the server over HTTP without
      # looping through the Cloudflare tunnel.
      SERVER_URL_INTERNAL: ${SERVER_URL_INTERNAL:-http://server:5100/server}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-personal-hub}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      # Full URL — Dokploy does not expand nested ${VITE_WEB_URL} in all cases
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-${VITE_WEB_URL}/media}
      AGENT_WORKER_URL: http://agent:4111
      FILES_API_SECRET: ${FILES_API_SECRET}
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/_api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

volumes:
  pg_data:
  redis_data:
  minio_data:
