# =============================================================================
# personal-hub — All-in-one Dokploy deployment
# =============================================================================
# Usage:
#   1. Set environment variables in Dokploy UI (see packages/env/.env.example)
#   2. Upload this repo to Dokploy
#   3. In Dokploy, use this as the Docker Compose file
#
# Required: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB (default personal_hub),
# REDIS_PASSWORD, MINIO_*, BETTER_AUTH_SECRET, VITE_SERVER_URL, VITE_WEB_URL,
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, FILES_API_SECRET
#
# SOURCE_COMMIT / build SHA
# -------------------------
# Dokploy does **not** inject git commit SHA into compose env today
# (open: Dokploy#2715, #4006 / PR #4007 for DOKPLOY_COMMIT_HASH).
# Our Dockerfiles therefore:
#   1. Accept build-args SOURCE_COMMIT / DOKPLOY_COMMIT_HASH / DOKPLOY_COMMIT_SHORT
#   2. Fall back to `git rev-parse HEAD` from the cloned repo (.git partial in context)
# Optional: set SOURCE_COMMIT in Dokploy Environment to force a value.
# Optional Advanced → custom command (prefixes with `docker`):
#   compose -p <project> -f docker-compose.yml up -d --build
#   after exporting SOURCE_COMMIT=$(git rev-parse HEAD) is not available via UI alone —
#   rely on Dockerfile git fallback instead.
# =============================================================================

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  # Service names stay short for depends_on, but we advertise unique DNS
  # aliases (hub-*). Dokploy attaches Traefik-enabled services to the shared
  # dokploy-network where many stacks also use alias "postgres"/"redis" —
  # resolving the generic name from server (on both networks) hits the wrong
  # container (28P01 password auth failure). Agent-only-on-project-network
  # can luck out; server cannot.
  postgres:
    # pgvector-enabled image (CREATE EXTENSION vector for few-shot ANN)
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Must be the database name (e.g. personal_hub), NOT the username.
      POSTGRES_DB: ${POSTGRES_DB:-personal_hub}
    networks:
      default:
        aliases:
          - hub-postgres
    healthcheck:
      # -d is required: without it pg_isready defaults DB name to the user
      # (e.g. personalhub), which does not exist when POSTGRES_DB differs.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-personal_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Host note: enable memory overcommit for safe BGSAVE under pressure:
    #   sysctl vm.overcommit_memory=1
    # (cannot set this sysctl from an unprivileged container)
    command: redis-server --appendonly yes --save 60 1000 --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      default:
        aliases:
          - hub-redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      default:
        aliases:
          - hub-minio

  # MinIO does not auto-create buckets. Local dev uses scripts/dev.sh + mc;
  # production must create S3_BUCKET once or uploads fail with
  # "The specified bucket does not exist".
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        i=0
        until mc alias set local http://hub-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i + 1))
          if [ "$$i" -gt 30 ]; then
            echo "minio not ready after 60s" >&2
            exit 1
          fi
          sleep 2
        done
        bucket="$${S3_BUCKET:-personal-hub}"
        mc mb --ignore-existing "local/$$bucket"
        echo "MinIO bucket ready: $$bucket"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-personal-hub}
    networks:
      - default

  # ── Apps ────────────────────────────────────────────────────────────────────

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        # Prefer explicit env; Dockerfiles also accept DOKPLOY_COMMIT_* + git fallback.
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        DOKPLOY_COMMIT_HASH: ${DOKPLOY_COMMIT_HASH:-}
        DOKPLOY_COMMIT_SHORT: ${DOKPLOY_COMMIT_SHORT:-}
        VITE_SERVER_URL: ${VITE_SERVER_URL}
        VITE_WEB_URL: ${VITE_WEB_URL}
        # Dummy URL for build-time module load only — runtime uses encode-db-url.sh
        DATABASE_URL: postgresql://build:build@localhost:5432/build
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
        RESEND_API_KEY: ${RESEND_API_KEY}
        EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      # Resume extract/apply download PDF bytes via mediaBucket on the API.
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-personal_hub}
      # Unique alias — not "postgres" (collides on dokploy-network).
      POSTGRES_HOST: hub-postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@hub-redis:6379
      AGENT_WORKER_URL: ${AGENT_WORKER_URL:-http://agent:4111}
      # Gmail Pub/Sub push auth (OIDC and/or shared secret)
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      GMAIL_PUSH_SHARED_SECRET: ${GMAIL_PUSH_SHARED_SECRET:-}
      GMAIL_PUSH_OIDC_AUDIENCE: ${GMAIL_PUSH_OIDC_AUDIENCE:-}
      GMAIL_PUSH_OIDC_EMAIL: ${GMAIL_PUSH_OIDC_EMAIL:-}
      GMAIL_PUSH_REQUIRE_AUTH: ${GMAIL_PUSH_REQUIRE_AUTH:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VITE_SERVER_URL: ${VITE_SERVER_URL}
      VITE_WEB_URL: ${VITE_WEB_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      # Google OAuth (login + Gmail Connections). Optional until set in Dokploy.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Optional Axiom wide-event drain (@tsu-stack/logger / evlog)
      AXIOM_API_KEY: ${AXIOM_API_KEY:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
      ENABLE_OPEN_API_DOCS: ${ENABLE_OPEN_API_DOCS:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # Same MinIO mapping as web — extractResume / resume PDF puts need mediaBucket.
      S3_ENDPOINT: http://hub-minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-personal-hub}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-${VITE_WEB_URL}/media}
      PORT: "5100"
      NODE_ENV: production
    healthcheck:
      # Migrations run before listen — allow a long start_period so first
      # deploy does not mark the container unhealthy mid-migrate.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5100/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    labels:
      - "traefik.enable=true"
      # Prefer a dedicated host (e.g. api.example.com) via Dokploy domain.
      # No /server path prefix — API is mounted at the URL root.
      - "traefik.http.routers.server.entrypoints=web"
      - "traefik.http.services.server.loadbalancer.server.port=5100"

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # App DB for Better Auth session verification (MastraAuthBetterAuth)
      POSTGRES_DB: ${POSTGRES_DB:-personal_hub}
      POSTGRES_HOST: hub-postgres
      # Dedicated Mastra storage DB (created if missing)
      MASTRA_POSTGRES_DB: mastra_agent
      CREATE_DB: "true"
      # Same secret as API — session signing for MastraAuthBetterAuth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      VITE_WEB_URL: ${VITE_WEB_URL}
      VITE_SERVER_URL: ${VITE_SERVER_URL}
      # Optional Axiom wide-event drain (agent process logs)
      AXIOM_API_KEY: ${AXIOM_API_KEY:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
      NODE_ENV: production
    healthcheck:
      # /api/health is auth-exempt; other /api/* require Better Auth session
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:4111/api/health || wget -qO- http://127.0.0.1:4111/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=PathPrefix(`/agent`)"
      - "traefik.http.routers.agent.priority=100"
      - "traefik.http.routers.agent.entrypoints=web"
      - "traefik.http.services.agent.loadbalancer.server.port=4111"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        DOKPLOY_COMMIT_HASH: ${DOKPLOY_COMMIT_HASH:-}
        DOKPLOY_COMMIT_SHORT: ${DOKPLOY_COMMIT_SHORT:-}
        VITE_SERVER_URL: ${VITE_SERVER_URL}
        VITE_WEB_URL: ${VITE_WEB_URL}
        # Dummy URL for build-time only — prerender is disabled
        DATABASE_URL: postgresql://build:build@localhost:5432/build
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      server: { condition: service_healthy }
      # Session lookup ($getUser / Better Auth drizzle) hits Postgres from SSR
      # after cross-subdomain cookies land on the web host.
      postgres: { condition: service_healthy }
      # Ensure S3_BUCKET exists before the files gateway accepts uploads.
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL}
      VITE_WEB_URL: ${VITE_WEB_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # SSR Better Auth reads session/user tables via @tsu-stack/db.
      # Without these, createPoolConfig falls through to empty DATABASE_URL
      # and node-postgres defaults to 127.0.0.1:5432 (ECONNREFUSED in Docker).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-personal_hub}
      POSTGRES_HOST: hub-postgres
      # SSR loads Better Auth (server env) even for public routes / health —
      # OAuth client credentials must be present or module init throws.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Internal Docker-network URL of the Hono server, used by the web
      # app's SSR-time oRPC client (avoids hairpin via public hostname).
      SERVER_URL_INTERNAL: ${SERVER_URL_INTERNAL:-http://server:5100}
      S3_ENDPOINT: http://hub-minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-personal-hub}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      # Full URL — Dokploy does not expand nested ${VITE_WEB_URL} in all cases
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-${VITE_WEB_URL}/media}
      AGENT_WORKER_URL: http://agent:4111
      FILES_API_SECRET: ${FILES_API_SECRET}
      # Optional Axiom wide-event drain (web SSR / request logs)
      AXIOM_API_KEY: ${AXIOM_API_KEY:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/_api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      # Catch-all last — server/agent PathPrefix routers must win first.
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

volumes:
  pg_data:
  redis_data:
  minio_data:
