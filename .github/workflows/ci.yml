name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# PRs can cancel superseded check runs. Never cancel main: a later
# web-only push was cancelling the server deploy that added listPage,
# so production web called /rpc/*/listPage and got 404 empty lists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared env for jobs that need packages/env/.env (web tests + build).
env:
  VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
  VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
  VITE_IMGPROXY_URL: ${{ vars.VITE_IMGPROXY_URL }}
  SOURCE_COMMIT: ${{ github.sha }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  # GitHub Actions reserves the GITHUB_ prefix; map GH_* secrets to app names.
  GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
  GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
  GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install
      - run: vp check

  # Unit tests: one monorepo job (not a per-package matrix).
  # `test:unit:run` uses `vp run -r --parallel test:unit` so package-graph
  # ordering does not skip later packages when an earlier suite fails.
  # @see https://viteplus.dev/guide/run#parallel-mode
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Write packages/env/.env for tests
        run: bash scripts/ci-write-web-env.sh packages/env/.env

      - run: vp run test:unit:run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install

      # Web build invokes dotenvx with packages/env/.env.
      - name: Write packages/env/.env for build
        run: bash scripts/ci-write-web-env.sh packages/env/.env

      - run: vp run build

  # Trigger Dokploy deploys only after CI is green on main.
  # Docs: https://docs.dokploy.com/docs/core/applications/going-production
  #       https://docs.dokploy.com/docs/core/auto-deploy
  #
  # Disable Auto Deploy on each Dokploy Application so pushes do not deploy
  # twice (webhook + this job).
  #
  # Path selection is per-app vs the SHA of that app's *last successful
  # Dokploy deploy* (Actions cache), not vs github.event.before (last push).
  # A web-only tip after undeployed server/agent commits still redeploys
  # server/agent until those apps catch up to HEAD.
  #
  # Required GitHub secrets:
  #   DOKPLOY_URL          e.g. https://dokploy.example.com  (no trailing slash)
  #   DOKPLOY_API_KEY      Dokploy profile → API key
  #   DOKPLOY_APP_SERVER_ID
  #   DOKPLOY_APP_AGENT_ID
  #   DOKPLOY_APP_WEB_ID
  # Optional:
  #   DOKPLOY_COMPOSE_ID   if set, also triggers compose.deploy when infra paths change
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history so last-deploy SHAs resolve for git diff.
          fetch-depth: 0

      # Per-app last successful deploy SHAs. restore-keys picks the newest
      # prior state when this run has never been saved yet.
      - name: Restore last-deploy state
        id: deploy_state
        uses: actions/cache/restore@v4
        with:
          path: .github/deploy-state.json
          key: dokploy-deploy-state-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            dokploy-deploy-state-${{ github.sha }}-
            dokploy-deploy-state-

      - name: Decide apps to deploy (since last successful deploy)
        id: plan
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          STATE_FILE=".github/deploy-state.json"
          if [ ! -f "$STATE_FILE" ]; then
            echo '{}' >"$STATE_FILE"
          fi

          # Per-app base = last SHA we successfully triggered for that app.
          # No record (or missing commit) → empty base → treat as dirty so a
          # lagging server/agent is never skipped after web-only pushes, and
          # the first run after enabling this logic catches up fully.
          resolve_base() {
            local app="$1"
            local recorded
            recorded="$(jq -r --arg k "$app" '.[$k] // empty' "$STATE_FILE")"
            if [ -n "$recorded" ] && git cat-file -e "${recorded}^{commit}" 2>/dev/null; then
              printf '%s' "$recorded"
              return
            fi
            printf ''
          }

          # True if any path under the given pathspecs changed base..HEAD.
          # Empty base ⇒ always dirty.
          paths_dirty() {
            local base="$1"
            shift
            if [ -z "$base" ]; then
              return 0
            fi
            # --quiet: exit 1 when diffs exist, 0 when identical.
            if git diff --quiet "$base" "$HEAD_SHA" -- "$@"; then
              return 1
            fi
            return 0
          }

          base_agent="$(resolve_base agent)"
          base_server="$(resolve_base server)"
          base_web="$(resolve_base web)"
          base_infra="$(resolve_base infra)"

          echo "deploy bases (last successful deploy per app; empty = never deployed / catch-up):"
          echo "  agent=${base_agent:-<none>} server=${base_server:-<none>} web=${base_web:-<none>} infra=${base_infra:-<none>}"
          echo "  HEAD=${HEAD_SHA}"

          want_agent=false
          want_server=false
          want_web=false
          want_infra=false

          # Root lockfile / workspace / docker helpers force every app image.
          # Check against each app's base: a lockfile change after only some
          # apps deployed must still rebuild the lagging ones (and siblings
          # that share the monorepo image inputs).
          shared_paths=(package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .node-version docker)
          if paths_dirty "$base_agent" "${shared_paths[@]}" \
            || paths_dirty "$base_server" "${shared_paths[@]}" \
            || paths_dirty "$base_web" "${shared_paths[@]}"; then
            want_agent=true
            want_server=true
            want_web=true
            echo "shared inputs dirty → all apps"
          fi

          if paths_dirty "$base_agent" \
            apps/agent packages/api packages/core packages/db packages/env \
            packages/logger packages/pdf; then
            want_agent=true
          fi
          if paths_dirty "$base_server" \
            apps/server packages/api packages/auth packages/core packages/db \
            packages/email packages/env packages/github packages/logger packages/pdf; then
            want_server=true
          fi
          if paths_dirty "$base_web" \
            apps/web packages/api packages/auth packages/core packages/db \
            packages/env packages/github packages/logger packages/seo packages/ui; then
            want_web=true
          fi
          if paths_dirty "$base_infra" \
            docker-compose.devhub-infra.yml docker-compose.yml docker-compose.prod.yml docker; then
            want_infra=true
          fi

          echo "will deploy: agent=${want_agent} server=${want_server} web=${want_web} infra=${want_infra}"

          {
            echo "want_agent=${want_agent}"
            echo "want_server=${want_server}"
            echo "want_web=${want_web}"
            echo "want_infra=${want_infra}"
          } >>"$GITHUB_OUTPUT"

      - name: Trigger Dokploy application deploys
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_SERVER_ID: ${{ secrets.DOKPLOY_APP_SERVER_ID }}
          DOKPLOY_APP_AGENT_ID: ${{ secrets.DOKPLOY_APP_AGENT_ID }}
          DOKPLOY_APP_WEB_ID: ${{ secrets.DOKPLOY_APP_WEB_ID }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          SOURCE_COMMIT: ${{ github.sha }}
          WANT_AGENT: ${{ steps.plan.outputs.want_agent }}
          WANT_SERVER: ${{ steps.plan.outputs.want_server }}
          WANT_WEB: ${{ steps.plan.outputs.want_web }}
          WANT_INFRA: ${{ steps.plan.outputs.want_infra }}
        run: |
          set -euo pipefail

          want_agent="${WANT_AGENT}"
          want_server="${WANT_SERVER}"
          want_web="${WANT_WEB}"
          want_infra="${WANT_INFRA}"

          if [ "${want_agent}" != "true" ] && [ "${want_server}" != "true" ] && [ "${want_web}" != "true" ] && [ "${want_infra}" != "true" ]; then
            echo "No deploy-relevant paths changed since last successful deploys; skipping Dokploy."
            # Still refresh cache key for this SHA so restore-keys stays ordered.
            exit 0
          fi

          : "${DOKPLOY_URL:?missing secret DOKPLOY_URL}"
          : "${DOKPLOY_API_KEY:?missing secret DOKPLOY_API_KEY}"

          base="${DOKPLOY_URL%/}"
          title="CI deploy ${SOURCE_COMMIT:0:7}"
          desc="Triggered after check/test/build on main (${SOURCE_COMMIT})"

          STATE_FILE=".github/deploy-state.json"
          if [ ! -f "$STATE_FILE" ]; then
            echo '{}' >"$STATE_FILE"
          fi

          mark_deployed() {
            local app="$1"
            jq --arg k "$app" --arg sha "$SOURCE_COMMIT" '.[$k]=$sha' "$STATE_FILE" >"${STATE_FILE}.tmp"
            mv "${STATE_FILE}.tmp" "$STATE_FILE"
          }

          deploy_app() {
            local id="$1"
            local name="$2"
            echo "→ application.deploy ${name} (${id})"
            curl -fsS -X POST "${base}/api/application.deploy" \
              -H "accept: application/json" \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              -d "$(jq -nc \
                --arg applicationId "$id" \
                --arg title "$title ($name)" \
                --arg description "$desc" \
                '{applicationId:$applicationId,title:$title,description:$description}')"
            echo
            mark_deployed "$name"
          }

          # Agent first (server calls AGENT_WORKER_URL), then server, then web.
          if [ "${want_agent}" = "true" ]; then
            : "${DOKPLOY_APP_AGENT_ID:?missing secret DOKPLOY_APP_AGENT_ID}"
            deploy_app "${DOKPLOY_APP_AGENT_ID}" "agent"
          else
            echo "skip agent (no changes since last agent deploy)"
          fi
          if [ "${want_server}" = "true" ]; then
            : "${DOKPLOY_APP_SERVER_ID:?missing secret DOKPLOY_APP_SERVER_ID}"
            deploy_app "${DOKPLOY_APP_SERVER_ID}" "server"
          else
            echo "skip server (no changes since last server deploy)"
          fi
          if [ "${want_web}" = "true" ]; then
            : "${DOKPLOY_APP_WEB_ID:?missing secret DOKPLOY_APP_WEB_ID}"
            deploy_app "${DOKPLOY_APP_WEB_ID}" "web"
          else
            echo "skip web (no changes since last web deploy)"
          fi

          if [ "${want_infra}" = "true" ]; then
            if [ -n "${DOKPLOY_COMPOSE_ID:-}" ]; then
              echo "→ compose.deploy (${DOKPLOY_COMPOSE_ID})"
              curl -fsS -X POST "${base}/api/compose.deploy" \
                -H "accept: application/json" \
                -H "Content-Type: application/json" \
                -H "x-api-key: ${DOKPLOY_API_KEY}" \
                -d "$(jq -nc \
                  --arg composeId "$DOKPLOY_COMPOSE_ID" \
                  --arg title "$title (infra)" \
                  --arg description "$desc" \
                  '{composeId:$composeId,title:$title,description:$description}')"
              echo
              mark_deployed "infra"
            else
              echo "infra paths changed but DOKPLOY_COMPOSE_ID unset; skip compose.deploy"
            fi
          else
            echo "skip compose.deploy (no changes since last infra deploy)"
          fi

          echo "updated deploy state:"
          cat "$STATE_FILE"

      # Always save after a successful plan+trigger step so the next push
      # diffs against the apps that actually deployed (or kept prior SHAs).
      - name: Save last-deploy state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .github/deploy-state.json
          key: dokploy-deploy-state-${{ github.sha }}-${{ github.run_id }}
