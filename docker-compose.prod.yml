name: personal-hub

services:
  server:
    ports:
      - "${SERVER_PORT:-5100}:5100"

  agent:
    ports:
      - "${AGENT_PORT:-4111}:4111"

  web:
    ports:
      - "${WEB_PORT:-3000}:3000"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
