# =============================================================================
# Local-only override for docker-compose.yml
# =============================================================================
# Exposes the three app services on the host so a plain browser can reach them
# without a Traefik instance. Infra services (postgres/redis/minio) keep
# their container-only networking.
#
# Usage:
#   cp .env.docker.example .env   # then fill in real secrets
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# =============================================================================

services:
  web:
    # When the browser calls the server from the host, it must use the
    # host-mapped port, not the in-network one. `SERVER_URL_INTERNAL` keeps
    # the in-container address for SSR-time oRPC calls (see orpc.ts).
    environment:
      VITE_SERVER_URL: http://localhost:${SERVER_PORT:-5100}
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Traefik labels from the base file are left in place — they are inert
    # when no Traefik provider is watching the Docker socket (i.e. local).

  server:
    ports:
      - "${SERVER_PORT:-5100}:5100"

  agent:
    ports:
      - "4111:4111"
